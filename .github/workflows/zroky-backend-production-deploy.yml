name: Zroky Backend Production Deploy

on:
  workflow_run:
    workflows: ["Zroky Backend CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Commit SHA to deploy (defaults to main)"
        required: false
        type: string

concurrency:
  group: zroky-backend-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
  RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
  RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
  RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
  RAILWAY_BEAT_SERVICE_ID: ${{ vars.RAILWAY_BEAT_SERVICE_ID }}
  PRODUCTION_API_URL: https://api.zroky.com

jobs:
  deploy:
    name: Deploy tested backend to Railway production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve tested revision
        id: revision
        env:
          DISPATCH_SHA: ${{ inputs.deploy_sha }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            SHA="${DISPATCH_SHA:-main}"
          else
            SHA="${TESTED_SHA}"
          fi
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Require production deployment configuration
        run: |
          set -euo pipefail
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_API_SERVICE_ID RAILWAY_WORKER_SERVICE_ID RAILWAY_BEAT_SERVICE_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not configured"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@4.33.0

      - name: Deploy tested API, worker, and beat
        id: deploy
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          deploy_and_wait() {
            local label="$1"
            local service_id="$2"
            local before_json before_id deployment_json candidate_id deployment_id status

            before_json="$(railway deployment list \
              --environment "${RAILWAY_ENVIRONMENT_ID}" \
              --service "${service_id}" \
              --limit 1 \
              --json)"
            before_id="$(jq -r '.[0].id // empty' <<<"${before_json}")"

            railway up \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT_ID}" \
              --service "${service_id}" \
              --detach \
              --message "GitHub revision ${DEPLOY_SHA} (${label})"

            deployment_id=""
            for attempt in {1..12}; do
              deployment_json="$(railway deployment list \
                --environment "${RAILWAY_ENVIRONMENT_ID}" \
                --service "${service_id}" \
                --limit 1 \
                --json)"
              candidate_id="$(jq -r '.[0].id // empty' <<<"${deployment_json}")"
              if [[ -n "${candidate_id}" && "${candidate_id}" != "${before_id}" ]]; then
                deployment_id="${candidate_id}"
                break
              fi
              sleep 5
            done
            if [[ -z "${deployment_id}" ]]; then
              echo "::error::Railway did not expose the new ${label} deployment id"
              return 1
            fi

            for attempt in {1..90}; do
              deployment_json="$(railway deployment list \
                --environment "${RAILWAY_ENVIRONMENT_ID}" \
                --service "${service_id}" \
                --limit 20 \
                --json)"
              status="$(jq -r --arg id "${deployment_id}" '.[] | select(.id == $id) | .status' <<<"${deployment_json}")"
              case "${status}" in
                SUCCESS)
                  echo "Railway ${label} deployment ${deployment_id} succeeded"
                  echo "${label}_deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
                  return 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  echo "::error::Railway ${label} deployment ${deployment_id} ended with ${status}"
                  return 1
                  ;;
                BUILDING|DEPLOYING|INITIALIZING|WAITING|QUEUED|"") sleep 10 ;;
                *) echo "Waiting for Railway ${label} deployment ${deployment_id}; status=${status}"; sleep 10 ;;
              esac
            done
            echo "::error::Timed out waiting for Railway ${label} deployment ${deployment_id}"
            return 1
          }

          deploy_and_wait api "${RAILWAY_API_SERVICE_ID}"
          deploy_and_wait worker "${RAILWAY_WORKER_SERVICE_ID}"
          deploy_and_wait beat "${RAILWAY_BEAT_SERVICE_ID}"

      - name: Set up Python for smoke checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify production health and provisioning guard
        working-directory: zroky-backend
        run: |
          python scripts/railway_smoke_check.py \
            --base-url "${PRODUCTION_API_URL}" \
            --expected-unauthorized-status 401 \
            --timeout-seconds 20

      - name: Publish deployment summary
        if: always()
        env:
          API_DEPLOYMENT_ID: ${{ steps.deploy.outputs.api_deployment_id }}
          WORKER_DEPLOYMENT_ID: ${{ steps.deploy.outputs.worker_deployment_id }}
          BEAT_DEPLOYMENT_ID: ${{ steps.deploy.outputs.beat_deployment_id }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          {
            echo "## Zroky backend production deployment"
            echo "- Revision: \`${DEPLOY_SHA}\`"
            echo "- API deployment: \`${API_DEPLOYMENT_ID:-not-submitted}\`"
            echo "- Worker deployment: \`${WORKER_DEPLOYMENT_ID:-not-submitted}\`"
            echo "- Beat deployment: \`${BEAT_DEPLOYMENT_ID:-not-submitted}\`"
            echo "- Production API: ${PRODUCTION_API_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

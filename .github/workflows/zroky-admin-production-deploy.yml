name: Admin production deploy

on:
  push:
    branches: [main]
    paths:
      - "zroky-admin/**"
      - "scripts/run_admin_deployment_smoke.py"
      - ".github/workflows/zroky-admin-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: zroky-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_ADMIN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy admin to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ADMIN_TOKEN }}
        run: npx --yes vercel@50.1.3 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Verify live admin routes
        run: python scripts/run_admin_deployment_smoke.py --admin-url https://ops.zroky.com

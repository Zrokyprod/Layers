name: Zroky Gateway Image

on:
  pull_request:
    paths:
      - "zroky-gateway/**"
      - "zroky-landing/src/pages/DocsPage.tsx"
      - ".github/workflows/zroky-gateway-publish.yml"
  push:
    tags:
      - "zroky-gateway-v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GATEWAY_IMAGE: ghcr.io/zrokyprod/zroky-gateway

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: zroky-gateway/go.sum

      - name: Test gateway
        working-directory: zroky-gateway
        run: |
          go test ./...
          go vet ./...

      - name: Build gateway image
        run: docker build --tag zroky-gateway:verify zroky-gateway

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/zroky-gateway-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATEWAY_IMAGE }}
          tags: |
            type=match,pattern=zroky-gateway-v(.*),group=1
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: zroky-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Verify anonymous pull
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#zroky-gateway-v}"
          docker logout ghcr.io
          for attempt in 1 2 3 4 5 6; do
            if docker pull "$GATEWAY_IMAGE:$VERSION"; then
              exit 0
            fi
            echo "Public image not visible yet; retrying in 10s..."
            sleep 10
          done
          exit 1
